<svg width="512" height="512" viewBox="0 0 512 512" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Added color-interpolation-filters="sRGB" to prevent gamma rounding errors at the seams -->
  <filter id="crpgParchment" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
    <!-- Kept the high-frequency 5 octaves for the fine, microscopic RT grit -->
    <feTurbulence type="fractalNoise" baseFrequency="0.015625 0.03125" numOctaves="5" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
    <feComponentTransfer in="grayNoise">
      <!-- Kept the flatter contrast for a uniform texture -->
      <feFuncR type="linear" slope="1.1" intercept="0"/>
      <feFuncG type="linear" slope="1.1" intercept="0"/>
      <feFuncB type="linear" slope="1.1" intercept="0"/>
    </feComponentTransfer>
  </filter>
  
  <!-- Lighter, warm yellowish-cream base color (Fantasy Hybrid) -->
  <rect x="-2" y="-2" width="516" height="516" fill="#f0e9d1"/>
  
  <!-- Kept the opacity low so the texture remains subtle -->
  <rect x="0" y="0" width="512" height="512" filter="url(#crpgParchment)" opacity="0.12" style="mix-blend-mode: multiply;"/>
  
  <!-- Warm golden-amber wash to tie the fantasy colors together -->
  <rect x="-2" y="-2" width="516" height="516" fill="#cfae84" opacity="0.10" style="mix-blend-mode: color-burn;"/>
</svg>