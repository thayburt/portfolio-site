<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Warm torchlight glowing from the center outward -->
    <radialGradient id="torchlight" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fff1d0" />
      <stop offset="40%" stop-color="#e8cd9c" />
      <stop offset="85%" stop-color="#b08149" />
      <stop offset="100%" stop-color="#593b1d" />
    </radialGradient>
    
    <!-- Drop shadow to lift the 'T' off the parchment -->
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1a0f08" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Circular Parchment Base -->
  <circle cx="50" cy="50" r="48" fill="url(#torchlight)" stroke="#3d2616" stroke-width="2"/>

  <!-- Circular ornate inner borders -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#7a4f2e" stroke-width="1.5" opacity="0.7"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#7a4f2e" stroke-width="0.5" opacity="0.5"/>

  <!-- The Heavy Iron 'T' (Custom Path) -->
  <path d="
      M 22 22 
      L 78 22 
      L 78 35 
      L 68 30 
      L 57 30 
      L 57 73 
      L 68 83 
      L 32 83 
      L 43 73 
      L 43 30 
      L 32 30 
      L 22 35 
      Z"
      fill="#261a15" filter="url(#dropshadow)"/>

  <!-- Inner highlight to make the 'T' look metallic and beveled -->
  <path d="
      M 26 25 
      L 74 25 
      L 74 33 
      L 66 28 
      L 55 28 
      L 55 73 
      L 66 81 
      L 34 81 
      L 45 73 
      L 45 28 
      L 34 28 
      L 26 33 
      Z"
      fill="none" stroke="#5c4434" stroke-width="1" opacity="0.6"/>
</svg>
